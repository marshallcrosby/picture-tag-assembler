<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        #imageDialog {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            padding: 20px;
            border: 1px solid #ccc;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            padding: 20px;
            max-width: 90%;
        }

        #imageDialog button {
            margin-top: 10px;
        }
    </style>
</head>
<body style="background-color: black;">
    <picture id="picture">
        <source srcset="https://picsum.photos/1200/800" media="(min-width: 1200px)">
        <source srcset="https://picsum.photos/800/600" media="(min-width: 800px)">
        <source srcset="https://picsum.photos/400/300" media="(min-width: 400px)">
        <img src="https://picsum.photos/300/1000" alt="Test">
    </picture>

    <script src="/js/picture-tag-assembler.js?breakpoints=576,768,992,1200,1440,1920&placeholder-service=https://picsum.photos&time-between-check=1000"></script>
</body>
</html>
